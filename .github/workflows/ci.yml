name: ci

# Linux-only matrix on purpose: macOS GitHub-hosted runners are
# billed at 10× the Linux rate. The release.yml workflow still
# builds macOS (Apple Silicon) wheels — that's where macOS coverage
# actually matters.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Use the `mold` linker for all Rust builds. mold is ~5-10× faster
  # than GNU ld on the link phase; the speedup compounds across the
  # rust + audit-rust + python jobs (each builds the workspace once,
  # and the python job additionally links the PyO3 cdylib). Set
  # globally on the workflow so every Rust step picks it up without
  # per-job opt-in. Installed via `rui314/setup-mold@v1` in each
  # Rust-using job below.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  rust:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # cargo-nextest runs tests in parallel with per-test process
      # isolation and smarter scheduling. Combined with `cargo llvm-cov
      # nextest` below, this preserves the coverage gate while cutting
      # test execution ~30-50% vs the default `cargo test` runner.
      # Installed precompiled via the taiki-e action (~3s vs ~2 min
      # `cargo install`).
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `cargo llvm-cov nextest` runs the full test suite under
      # instrumentation AND enforces the coverage gate.
      # `--fail-under-regions 88` stands in for branch coverage:
      # cargo-llvm-cov on stable Rust has no `--fail-under-branches`
      # flag (branch support is unstable upstream), and LLVM "regions"
      # are finer-grained than lines — they split lines on conditional
      # boundaries — so a region threshold approximates branch
      # coverage well.
      #
      # 88% (instead of 90%) reflects the current floor on
      # `postgres.rs` — its line coverage is already 90.51% but
      # region coverage sits at ~88.6% because of error-handling
      # arms in `impl DataAdapter` that only fire on Postgres
      # connection failures (timeouts, type mismatches in user
      # SQL, etc.). Those branches are reachable but expensive to
      # exercise from the Rust test suite alone. Ratchet upward as
      # those paths gain explicit tests.
      #
      # `--ignore-filename-regex` excludes the PyO3 entrypoint
      # (`ematix-probe-py/src/lib.rs`) — its symbols are only invoked
      # from Python via `import ematix_probe._core`, so the Rust test
      # suite never reaches them and they would always show 0%. The
      # Python job's pytest run exercises this code path through the
      # `from ematix_probe._core import ...` calls in `probe.py`.
      - run: cargo llvm-cov nextest --workspace --all-targets --fail-under-regions 88 --summary-only --ignore-filename-regex 'ematix-probe-py/src/'

  audit-rust:
    name: cargo audit + cargo deny (RustSec + license policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Shell-based cargo audit instead of the `rustsec/audit-check`
      # action — that one tries to post a GitHub Check Run, which
      # needs `checks: write` permission. Granting that to the whole
      # workflow expands the privilege surface; running the binary
      # directly is just as effective. `cargo audit` checks
      # `Cargo.lock` against the RustSec advisory DB and exits
      # non-zero on any non-ignored vulnerability. `.cargo/audit.toml`
      # lists ignored advisory IDs with rationale (empty for now).
      # Unmaintained warnings don't fail CI — they're informational.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        run: cargo audit
      # cargo-deny enforces the license allow-list in `deny.toml`
      # against the full Rust dep closure (direct + transitive). A
      # transitive bump that drags in a copyleft (GPL/AGPL/LGPL) or
      # source-available (SSPL/BUSL/Elastic) license fails this step
      # and blocks the PR. License audit on 2026-05-07 confirmed the
      # current closure is clean against the configured allow-list.
      - uses: taiki-e/install-action@cargo-deny
      - name: Run cargo deny (licenses)
        run: cargo deny check licenses

  python:
    name: python (ubuntu-latest, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # uv replaces pip for the dep-install step. It parallelises
      # downloads and uses a local content-addressed cache, which on
      # heavy scientific wheels (numpy, pyarrow, duckdb) is dramatically
      # faster than pip. `enable-cache: true` persists uv's cache
      # across runs; `cache-dependency-glob` keys it on
      # `requirements-dev.lock` so a lockfile bump invalidates cleanly.
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "requirements-dev.lock"
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `maturin develop` requires an active virtualenv (it refuses
      # to install into the system Python). `uv venv` creates one
      # ~10× faster than `python -m venv`; persist its bin/ on PATH
      # and VIRTUAL_ENV across subsequent steps via $GITHUB_PATH /
      # $GITHUB_ENV so every later `python` / `uv` / `maturin` /
      # `pytest` invocation resolves through it.
      - name: Set up venv
        shell: bash
        run: |
          uv venv .venv --python ${{ matrix.python }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install dev deps
        # Pinned via `requirements-dev.lock` (generated by pip-compile
        # from `pyproject.toml`'s [project.optional-dependencies].dev).
        # Regenerate locally with `make lock`. Pinning gives
        # pip-licenses a stable closure to audit and makes CI
        # reproducible across re-runs. `uv pip install` is a drop-in
        # for `pip install` against the same lockfile — install order
        # and resolved versions are identical.
        run: uv pip install -r requirements-dev.lock
      - name: Build extension
        run: maturin develop --release
      - name: Lint
        run: ruff check python tests
      - name: Bandit (medium+ severity, no findings allowed)
        run: bandit -r python -ll -c pyproject.toml
      - name: pip-audit (Python deps)
        # `--skip-editable` excludes the in-tree `ematix-probe`
        # install (maturin develop creates an editable install
        # that pip-audit can't look up on PyPI yet). Default
        # behavior fails on any advisory in the non-editable deps;
        # `--strict` would treat the editable skip itself as a
        # failure, which we don't want.
        run: pip-audit --skip-editable
      - name: pip-licenses (license policy)
        # Fails CI if any installed dep matches a strict-copyleft or
        # source-available license. Substring match — `(GPLv2)` /
        # `(GPLv3)` are the trove-classifier formats unique to strict
        # GPL (LGPL classifiers spell `(LGPLv...` so they don't
        # match). LGPL is intentionally absent from `--fail-on`:
        # `psycopg2-binary` is LGPL but dev/test-only and not shipped.
        # Matching brand names (Affero, SSPL, BUSL, Commons Clause,
        # Elastic, Hippocratic) catches non-OSI source-available
        # licenses regardless of how PyPI classifies them.
        run: |
          pip-licenses --fail-on='Affero;Server Side Public License;Business Source License;Commons Clause;Elastic License;Hippocratic;(GPLv2);(GPLv3)' \
            --format=markdown --with-urls
      - name: Test
        # Run coverage as the entry point (`coverage run -m pytest`)
        # rather than `pytest --cov`. The pytest11 entry point loads
        # `ematix_probe.pytest_plugin` at pytest startup, which (via
        # Python's package import semantics) also runs
        # `ematix_probe/__init__.py`. With `pytest --cov`, coverage
        # initialization happens *after* that — so `ematix_probe` is
        # already imported when measurement starts and gets flagged
        # `module-not-measured`, dragging total coverage to ~70%.
        # `coverage run` starts measurement before pytest loads, so
        # the plugin import is tracked normally.
        # `--cov-branch` lives in `[tool.coverage.run] branch = true`
        # in pyproject.toml, so no flag needed here.
        run: |
          coverage run -m pytest
          coverage report --fail-under=90 --show-missing
          coverage xml
