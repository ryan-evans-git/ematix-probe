[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ematix-probe"
version = "0.1.0.dev0"
description = "Declarative testing automation: data probes + load probes, on a Rust core. Assert on the shape of data in Postgres / DuckDB / Parquet (local + S3) and on the behavior of HTTP and SQL services under synthetic load — using one declarative API and one CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ryan Evans", email = "ryanevans23@gmail.com" },
]
keywords = [
    "testing",
    "test-automation",
    "data-quality",
    "load-testing",
    "performance-testing",
    "data-pipeline",
    "postgres",
    "duckdb",
    "parquet",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/ryan-evans-git/ematix-probe"
Issues = "https://github.com/ryan-evans-git/ematix-probe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "maturin>=1.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pip-tools>=7.4",
    "testcontainers[postgres,localstack]>=4.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[tool.maturin]
manifest-path = "crates/ematix-probe-py/Cargo.toml"
module-name = "ematix_probe._core"
python-source = "python"
features = ["ematix-probe-py/extension-module"]
strip = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
addopts = "-q"

[tool.coverage.run]
# `branch = true` makes local `pytest --cov` runs match CI, which
# gates PRs at 90% branch coverage (see .github/workflows/ci.yml).
# `source` keeps coverage focused on the `ematix_probe` package
# rather than test files or the maturin-built `_core.so`.
branch = true
source = ["ematix_probe"]

[tool.bandit]
# bandit scans `python/` for security smells. Test fixtures often
# contain dummy passwords / SQL strings that aren't real findings;
# we exclude `tests/` and `python/*/tests/` for the same reason
# ematix-flow does. Per-finding suppressions go below; each must
# carry a comment with rationale.
exclude_dirs = ["tests", "python/ematix_probe/tests"]
skips = []

