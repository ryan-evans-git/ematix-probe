[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ematix-probe"
version = "0.1.3"
description = "Declarative data-quality + load probes for Python. Rust + tokio under the hood."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: SPDX expression + explicit `license-files` glob list.
# The deprecated `{ text = "Apache-2.0" }` form told build
# backends the license name but did NOT package the LICENSE /
# NOTICE files into the sdist; PyPI's metadata validator then
# rejected the v0.1.0 sdist with
#   400 License-File LICENSE does not exist in distribution file
# (wheels published fine — they got the metadata via a different
# code path). The PEP 639 form below tells maturin to include
# both files at the sdist root, satisfying PyPI on the next
# upload.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ryan Evans", email = "ryanevans23@gmail.com" },
]
keywords = [
    "testing",
    "test-automation",
    "data-quality",
    "load-testing",
    "performance-testing",
    "data-pipeline",
    "postgres",
    "duckdb",
    "parquet",
]
classifiers = [
    # Per PEP 639: when the SPDX `license` field is set on
    # [project], the legacy `License :: ...` trove classifier
    # is deprecated. Modern PyPI uploads warn (or reject) on
    # both being set — the SPDX field is canonical.
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/ryan-evans-git/ematix-probe"
Issues = "https://github.com/ryan-evans-git/ematix-probe/issues"

[project.scripts]
# Console-script entry point. `pip install ematix-probe` produces
# an `ematix-probe` command on PATH that dispatches to
# `ematix_probe.cli.main`. The Rust binary at
# `crates/ematix-probe-cli` stays as workspace scaffolding but
# isn't user-facing — probe discovery lives where probes live.
ematix-probe = "ematix_probe.cli:main"

[project.entry-points."pytest11"]
# Auto-load the ematix-probe pytest plugin when the package is
# installed, so `@probe.data` instances become pytest items
# without users wiring `pytest_plugins` themselves.
#
# IMPORTANT: the LHS (entry-point name) must equal the dotted
# module path on the RHS. pluggy uses the LHS as the registration
# name; if a conftest also lists this module via
# `pytest_plugins = ["ematix_probe.pytest_plugin"]` (which our
# own tests do), pluggy registers it again under that dotted-name
# and refuses if the names disagree:
#   ValueError: Plugin already registered under a different name
"ematix_probe.pytest_plugin" = "ematix_probe.pytest_plugin"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "maturin>=1.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pip-tools>=7.4",
    "testcontainers[postgres,localstack]>=4.0",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[tool.maturin]
manifest-path = "crates/ematix-probe-py/Cargo.toml"
module-name = "ematix_probe._core"
python-source = "python"
features = ["ematix-probe-py/extension-module"]
strip = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplifications
]

[tool.pytest.ini_options]
testpaths = ["tests", "python"]
addopts = "-q"

[tool.coverage.run]
# `branch = true` makes local `pytest --cov` runs match CI, which
# gates PRs at 90% branch coverage (see .github/workflows/ci.yml).
# `source` keeps coverage focused on the `ematix_probe` package
# rather than test files or the maturin-built `_core.so`.
branch = true
source = ["ematix_probe"]

[tool.bandit]
# bandit scans `python/` for security smells. Test fixtures often
# contain dummy passwords / SQL strings that aren't real findings;
# we exclude `tests/` and `python/*/tests/` for the same reason
# ematix-flow does. Per-finding suppressions go below; each must
# carry a comment with rationale.
exclude_dirs = ["tests", "python/ematix_probe/tests"]
skips = []

